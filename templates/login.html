<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>登录 - 大焱资料管理系统</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    <style>
        :root {
            --brand: #38a3f5;
            --brand-light: #7cc6fb;
            --brand-deep: #1d7fd4;
            --sky-1: #eaf6ff;
            --sky-2: #d5ecff;
            --sky-3: #c2e2fd;
            --text-main: #10344f;
            --text-sub: #5b7f9c;
            --border: #d3e8f8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            color: var(--text-main);
            background: var(--sky-1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        /* 背景：淡天蓝渐变 */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(1000px 640px at 10% 4%, rgba(124, 198, 251, 0.55), transparent 62%),
                radial-gradient(880px 620px at 92% 96%, rgba(160, 216, 254, 0.5), transparent 62%),
                linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 52%, var(--sky-3) 100%);
        }
        /* 斜向柔光 */
        .bg-layer::before {
            content: "";
            position: absolute;
            inset: -30%;
            background: linear-gradient(72deg,
                transparent 42%,
                rgba(255, 255, 255, 0.55) 48%,
                rgba(255, 255, 255, 0.85) 50%,
                rgba(255, 255, 255, 0.55) 52%,
                transparent 58%);
            transform: rotate(-6deg);
            animation: beamDrift 22s ease-in-out infinite alternate;
        }
        /* 底部云朵辉光 */
        .bg-layer::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -300px;
            width: 1400px;
            height: 560px;
            transform: translateX(-50%);
            background: radial-gradient(closest-side, rgba(255, 255, 255, 0.9), transparent 78%);
            filter: blur(6px);
        }
        @keyframes beamDrift {
            from { transform: rotate(-6deg) translate3d(-3%, 0, 0); }
            to   { transform: rotate(-6deg) translate3d(3%, 0, 0); }
        }

        /* 细网格纹理（浅色调） */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(56, 163, 245, 0.085) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 163, 245, 0.085) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 76%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 76%);
            pointer-events: none;
        }

        /* 登录卡片：白色玻璃质感 */
        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 36px 32px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 1) inset,
                0 20px 48px -20px rgba(29, 127, 212, 0.35),
                0 0 90px -30px rgba(124, 198, 251, 0.8);
            animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.985); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 顶部品牌 */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-logo {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand) 100%);
            box-shadow: 0 10px 22px -8px rgba(56, 163, 245, 0.75);
            margin-bottom: 16px;
        }
        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
            margin: 0 0 6px;
        }
        .brand-sub {
            font-size: 0.86rem;
            color: var(--text-sub);
            margin: 0;
        }

        /* 表单 */
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            color: #3c6485;
            margin-bottom: 7px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap .field-icon {
            position: absolute;
            left: 14px;
            color: #8fb4cf;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }
        .input-wrap input {
            width: 100%;
            height: 46px;
            padding: 0 44px 0 40px;
            font-size: 0.94rem;
            color: var(--text-main);
            background: #f5fbff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .input-wrap input::placeholder { color: #9fbcd4; }
        .input-wrap input:hover { border-color: #b3d9f5; }
        .input-wrap input:focus {
            background: #fff;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(124, 198, 251, 0.28);
        }
        .input-wrap:focus-within .field-icon { color: var(--brand); }

        .toggle-pwd {
            position: absolute;
            right: 6px;
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: #8fb4cf;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .toggle-pwd:hover { color: var(--brand-deep); background: rgba(124, 198, 251, 0.2); }

        /* 提交按钮 */
        .btn-login {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand) 55%, var(--brand-deep) 100%);
            box-shadow: 0 10px 22px -10px rgba(56, 163, 245, 0.95);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px -12px rgba(29, 127, 212, 0.9);
            filter: brightness(1.04);
        }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled { cursor: not-allowed; opacity: 0.75; }
        .btn-login.is-success {
            background: linear-gradient(135deg, #34d399 0%, var(--success) 100%);
            box-shadow: 0 10px 22px -10px rgba(16, 185, 129, 0.9);
        }

        /* 错误提示 */
        .error-message {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            animation: shake 0.4s ease;
        }
        .error-message.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 底部 */
        .card-footer-note {
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid #e4f2fd;
            text-align: center;
            font-size: 0.78rem;
            color: #8fb4cf;
        }

        /* 小屏适配 */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 32px 22px 26px; border-radius: 16px; }
            .brand-title { font-size: 1.2rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card, .error-message { animation: none; }
            .btn-login { transition: none; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="bg-grid"></div>

    <main class="login-card">
        <!-- 品牌区 -->
        <div class="brand">
            <div class="brand-logo"><i class="fa fa-fire"></i></div>
            <h1 class="brand-title">大焱资料管理系统</h1>
            <p class="brand-sub">请登录后继续使用</p>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" method="POST" autocomplete="on" novalidate>
            <div class="field">
                <label for="username">用户名</label>
                <div class="input-wrap">
                    <i class="fa fa-user field-icon"></i>
                    <input type="text" id="username" name="username" placeholder="请输入用户名"
                           autocomplete="username" autofocus required>
                </div>
            </div>

            <div class="field">
                <label for="password">密码</label>
                <div class="input-wrap">
                    <i class="fa fa-lock field-icon"></i>
                    <input type="password" id="password" name="password" placeholder="请输入密码"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-pwd" id="toggle-password" aria-label="显示/隐藏密码" tabindex="-1">
                        <i class="fa fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <span>登 录</span>
                <i class="fa fa-arrow-right"></i>
            </button>

            <div class="error-message" id="error-message" role="alert">
                <i class="fa fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>
        </form>

        <div class="card-footer-note">© 2025 大焱资料管理系统</div>
    </main>

    <script>
    (function () {
        var loginForm = document.getElementById('login-form');
        var loginBtn = document.getElementById('login-btn');
        var errorBox = document.getElementById('error-message');
        var errorText = document.getElementById('error-text');
        var passwordInput = document.getElementById('password');
        var toggleBtn = document.getElementById('toggle-password');

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.classList.add('show');
        }

        function clearError() {
            errorBox.classList.remove('show');
            errorText.textContent = '';
        }

        // 密码显示 / 隐藏
        toggleBtn.addEventListener('click', function () {
            var isPwd = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPwd ? 'text' : 'password');
            var icon = this.querySelector('i');
            icon.classList.toggle('fa-eye', !isPwd);
            icon.classList.toggle('fa-eye-slash', isPwd);
            passwordInput.focus();
        });

        function getCsrfToken() {
            var meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.content : '';
        }

        // 读取未登录前被拦截的原始地址（由后端 302 到 /login?next=... 时附带）
        function getNextUrl() {
            try {
                return new URLSearchParams(window.location.search).get('next') || '';
            } catch (e) {
                return '';
            }
        }

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            clearError();

            var username = document.getElementById('username').value.trim();
            var password = passwordInput.value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i><span>登录中...</span>';

            try {
                var response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username: username, password: password, next: getNextUrl() })
                });

                if (response.ok) {
                    var data = await response.json();
                    loginBtn.classList.add('is-success');
                    loginBtn.innerHTML = '<i class="fa fa-check"></i><span>登录成功</span>';
                    setTimeout(function () {
                        window.location.href = data.redirect || '/';
                    }, 700);
                    return;
                }

                var errorData = {};
                try { errorData = await response.json(); } catch (e) { /* 忽略非 JSON 响应 */ }
                showError(errorData.message || '登录失败，请重试');
            } catch (err) {
                showError('登录请求失败，请检查网络连接');
            }

            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span>登 录</span><i class="fa fa-arrow-right"></i>';
        });
    })();
    </script>
</body>
</html>
