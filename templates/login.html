<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>登录 - 大焱资料管理系统</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    <style>
        :root {
            --brand: #1b6bff;
            --brand-bright: #4d94ff;
            --brand-deep: #0b5ed7;
            --ink: #0f1c2e;
            --ink-soft: #64748b;
            --border: #dfe8f5;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            color: #fff;
            background: #071220;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ---------- 深空蓝底 + 光晕 + 网格 ---------- */
        .stage {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(1200px 820px at 12% 4%, rgba(27, 107, 255, 0.30), transparent 62%),
                radial-gradient(1000px 700px at 96% 100%, rgba(0, 168, 232, 0.20), transparent 62%),
                linear-gradient(160deg, #071427 0%, #0a1b33 46%, #081525 100%);
        }
        /* 细网格：只做肌理，不抢视线 */
        .stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(120, 170, 255, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 170, 255, 0.055) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 38% 42%, #000 0%, transparent 74%);
            -webkit-mask-image: radial-gradient(circle at 38% 42%, #000 0%, transparent 74%);
            pointer-events: none;
        }
        /* 大面积柔光球，制造纵深 */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }
        .orb-a {
            width: 520px; height: 520px;
            left: -140px; top: -160px;
            background: rgba(27, 107, 255, 0.40);
        }
        .orb-b {
            width: 420px; height: 420px;
            left: 34%; bottom: -180px;
            background: rgba(0, 150, 255, 0.22);
            animation-delay: -6s;
        }
        .orb-c {
            width: 360px; height: 360px;
            right: -120px; top: 40%;
            background: rgba(77, 148, 255, 0.18);
            animation-delay: -11s;
        }
        @keyframes floatOrb {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(26px, -30px, 0) scale(1.06); }
        }

        /* 巨幅水印字：增加版面分量 */
        .watermark {
            position: absolute;
            left: 2vw;
            bottom: -3vw;
            font-size: clamp(90px, 15vw, 220px);
            font-weight: 900;
            letter-spacing: 8px;
            line-height: 1;
            color: rgba(255, 255, 255, 0.035);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }

        .layout {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 1360px;
            margin: 0 auto;
            padding: 64px 64px;
        }

        /* ---------- 左：品牌主张 ---------- */
        .brand-panel {
            flex: 1 1 auto;
            min-width: 0;
            padding-right: 24px;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .brand-badge .mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px; height: 46px;
            border-radius: 13px;
            font-size: 1.15rem;
            color: #fff;
            background: linear-gradient(140deg, var(--brand-bright), var(--brand));
            box-shadow: 0 14px 30px -12px rgba(27, 107, 255, 0.9);
        }
        .brand-badge .name {
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
            font-size: 0.76rem;
            letter-spacing: 3px;
            color: rgba(140, 180, 240, 0.85);
        }
        .eyebrow::before {
            content: "";
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--brand-bright);
            box-shadow: 0 0 10px 2px rgba(77, 148, 255, 0.85);
        }

        .brand-title {
            margin: 0 0 18px;
            font-size: clamp(2.2rem, 3.1vw, 3.2rem);
            font-weight: 800;
            line-height: 1.18;
            letter-spacing: 4px;
            color: #fff;
        }
        .brand-title .accent {
            display: block;
            background: linear-gradient(96deg, #7fb4ff 0%, #4d94ff 45%, #a9d4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .brand-sub {
            max-width: 460px;
            margin: 0 0 44px;
            font-size: 1rem;
            line-height: 1.95;
            letter-spacing: 1px;
            color: rgba(214, 230, 250, 0.62);
        }

        /* 三个能力点，横向罗列 */
        .brand-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            margin-bottom: 46px;
        }
        .brand-features .item {
            padding: 0 30px;
            border-left: 1px solid rgba(255, 255, 255, 0.10);
        }
        .brand-features .item:first-child { padding-left: 0; border-left: none; }
        .brand-features .num {
            font-size: 1.32rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }
        .brand-features .num small { font-size: 0.78rem; font-weight: 600; margin-left: 4px; color: rgba(200, 220, 245, 0.7); }
        .brand-features .cap {
            margin-top: 6px;
            font-size: 0.80rem;
            letter-spacing: 1px;
            color: rgba(190, 212, 240, 0.58);
        }

        .brand-foot {
            font-size: 0.76rem;
            letter-spacing: 1px;
            color: rgba(180, 205, 235, 0.42);
        }

        /* ---------- 右：玻璃登录卡 ---------- */
        .form-panel {
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-end;
        }
        .login-card {
            width: 400px;
            max-width: 100%;
            padding: 44px 40px 32px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.965);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow:
                0 40px 90px -34px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 1px 0 rgba(255, 255, 255, 1) inset;
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
            color: var(--ink);
            animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            margin: 0 0 6px;
            font-size: 1.42rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--ink);
        }
        .card-sub {
            margin: 0 0 28px;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        /* 输入项 */
        .field { margin-bottom: 18px; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap .field-icon {
            position: absolute;
            left: 15px;
            font-size: 0.95rem;
            color: #9db0c8;
            pointer-events: none;
            transition: color 0.2s ease;
        }
        .input-wrap input {
            width: 100%;
            height: 50px;
            padding: 0 46px 0 40px;
            font-size: 0.94rem;
            color: var(--ink);
            background: #f9fbff;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .input-wrap input::placeholder { color: #a9bacd; }
        .input-wrap input:hover { border-color: #c8d9ee; }
        .input-wrap input:focus {
            background: #fff;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(27, 107, 255, 0.13);
        }
        .input-wrap:focus-within .field-icon { color: var(--brand); }

        .toggle-pwd {
            position: absolute;
            right: 7px;
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #9db0c8;
            font-size: 0.86rem;
            cursor: pointer;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .toggle-pwd:hover { color: var(--brand); background: rgba(27, 107, 255, 0.08); }

        .form-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 4px 0 22px;
            font-size: 0.80rem;
            color: #8497ad;
        }
        .remember-check {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            user-select: none;
        }
        .remember-check input {
            width: 15px; height: 15px;
            margin: 0;
            accent-color: var(--brand);
            cursor: pointer;
        }
        .form-meta .meta-hint { color: #9fb0c4; }

        /* 登录按钮 */
        .btn-login {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 6px;
            text-indent: 6px;          /* 抵消字距造成的视觉偏左 */
            cursor: pointer;
            background: linear-gradient(96deg, var(--brand) 0%, #2f7dff 100%);
            box-shadow: 0 16px 30px -14px rgba(27, 107, 255, 0.95);
            transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        .btn-login:hover:not(:disabled) {
            filter: brightness(1.07);
            box-shadow: 0 20px 36px -16px rgba(11, 94, 215, 0.95);
            transform: translateY(-1px);
        }
        .btn-login:active:not(:disabled) { transform: translateY(1px); }
        .btn-login:disabled { cursor: not-allowed; opacity: 0.72; }
        .btn-login.is-success {
            background: #10b981;
            letter-spacing: 2px;
            text-indent: 0;
            box-shadow: 0 16px 30px -14px rgba(16, 185, 129, 0.9);
        }

        /* 错误提示 */
        .error-message {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 13px;
            font-size: 0.83rem;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 9px;
            animation: shake 0.4s ease;
        }
        .error-message.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .card-note {
            margin: 26px 0 0;
            padding-top: 18px;
            border-top: 1px solid #edf2f9;
            text-align: center;
            font-size: 0.75rem;
            line-height: 1.9;
            color: #a2b2c5;
        }
        .card-note .copyright { display: block; margin-top: 2px; color: #b7c4d4; }

        /* ---------- 响应式 ---------- */
        @media (max-width: 1120px) {
            .layout { gap: 28px; padding: 48px 40px; }
            .brand-features .item { padding: 0 20px; }
        }
        @media (max-width: 960px) {
            .layout { justify-content: center; padding: 32px 20px; }
            .brand-panel { display: none; }
            .watermark { display: none; }
            .form-panel { justify-content: center; }
            .login-card { width: 400px; }
        }
        @media (max-width: 420px) {
            .login-card { padding: 34px 22px 26px; border-radius: 16px; }
            .card-title { font-size: 1.28rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .login-card, .error-message { animation: none; }
            .orb { animation: none; }
            .btn-login { transition: none; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="watermark">BOM3</div>

        <div class="layout">
            <!-- 左：品牌主张 -->
            <section class="brand-panel">
                <div class="brand-badge">
                    <span class="mark"><i class="fa fa-cube"></i></span>
                    <span class="name">大焱资料管理系统</span>
                </div>

                <div class="eyebrow">MANUFACTURING DATA PLATFORM</div>

                <h1 class="brand-title">
                    制造资料
                    <span class="accent">统一管理 · 快速查询</span>
                </h1>

                <p class="brand-sub">
                    车种、成品、SubList 与 UsageList 资料集中管理，<br>
                    千万级记录秒级检索，MES 业务协同作业。
                </p>

                <div class="brand-features">
                    <div class="item">
                        <div class="num">100<small>万+</small></div>
                        <div class="cap">资料记录统一归集</div>
                    </div>
                    <div class="item">
                        <div class="num">秒级<small></small></div>
                        <div class="cap">索引检索响应</div>
                    </div>
                    <div class="item">
                        <div class="num">全链路<small></small></div>
                        <div class="cap">MES 业务协同</div>
                    </div>
                </div>

                <div class="brand-foot">内部制造资料平台 · 请使用授权账号登录</div>
            </section>

            <!-- 右：登录卡片 -->
            <section class="form-panel">
                <div class="login-card">
                    <h2 class="card-title">账号登录</h2>
                    <p class="card-sub">欢迎回来，请登录你的账号</p>

                    <form id="login-form" method="POST" autocomplete="on" novalidate>
                        <div class="field">
                            <div class="input-wrap">
                                <i class="fa fa-user-o field-icon"></i>
                                <input type="text" id="username" name="username" placeholder="账号"
                                       autocomplete="username" autofocus required>
                            </div>
                        </div>

                        <div class="field">
                            <div class="input-wrap">
                                <i class="fa fa-lock field-icon"></i>
                                <input type="password" id="password" name="password" placeholder="密码"
                                       autocomplete="current-password" required>
                                <button type="button" class="toggle-pwd" id="toggle-password" aria-label="显示/隐藏密码" tabindex="-1">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-meta">
                            <label class="remember-check">
                                <input type="checkbox" id="remember" name="remember">
                                <span>记住登录状态</span>
                            </label>
                            <span class="meta-hint">忘记密码请联系管理员</span>
                        </div>

                        <button type="submit" class="btn-login" id="login-btn">登录</button>

                        <div class="error-message" id="error-message" role="alert">
                            <i class="fa fa-exclamation-circle"></i>
                            <span id="error-text"></span>
                        </div>
                    </form>

                    <p class="card-note">
                        登录即同意系统使用规范
                        <span class="copyright">© 2025 大焱资料管理系统</span>
                    </p>
                </div>
            </section>
        </div>
    </div>

    <script>
    (function () {
        var loginForm = document.getElementById('login-form');
        var loginBtn = document.getElementById('login-btn');
        var errorBox = document.getElementById('error-message');
        var errorText = document.getElementById('error-text');
        var passwordInput = document.getElementById('password');
        var toggleBtn = document.getElementById('toggle-password');
        var rememberInput = document.getElementById('remember');

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.classList.add('show');
        }

        function clearError() {
            errorBox.classList.remove('show');
            errorText.textContent = '';
        }

        // 锁定倒计时：后端返回 429 + retry_after 时调用，期间禁用按钮并实时刷新剩余秒数
        var _lockTimer = null;
        function startLockCountdown(sec) {
            loginBtn.disabled = true;
            if (_lockTimer) { clearInterval(_lockTimer); }
            var remain = parseInt(sec, 10) || 0;
            function tick() {
                if (remain <= 0) {
                    if (_lockTimer) { clearInterval(_lockTimer); _lockTimer = null; }
                    loginBtn.disabled = false;
                    clearError();
                    return;
                }
                showError('登录尝试次数过多，请 ' + remain + ' 秒后重试');
                remain -= 1;
            }
            tick();
            _lockTimer = setInterval(tick, 1000);
        }

        // 密码显示 / 隐藏
        toggleBtn.addEventListener('click', function () {
            var isPwd = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPwd ? 'text' : 'password');
            var icon = this.querySelector('i');
            icon.classList.toggle('fa-eye', !isPwd);
            icon.classList.toggle('fa-eye-slash', isPwd);
            passwordInput.focus();
        });

        function getCsrfToken() {
            var meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.content : '';
        }

        // 读取未登录前被拦截的原始地址（由后端 302 到 /login?next=... 时附带）
        function getNextUrl() {
            try {
                return new URLSearchParams(window.location.search).get('next') || '';
            } catch (e) {
                return '';
            }
        }

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            clearError();

            var username = document.getElementById('username').value.trim();
            var password = passwordInput.value;

            if (!username || !password) {
                showError('请输入账号和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i><span>登录中…</span>';

            try {
                var response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        remember: rememberInput ? rememberInput.checked : false,
                        next: getNextUrl()
                    })
                });

                if (response.ok) {
                    var data = await response.json();
                    loginBtn.classList.add('is-success');
                    loginBtn.innerHTML = '<i class="fa fa-check"></i><span>登录成功</span>';
                    setTimeout(function () {
                        window.location.href = data.redirect || '/';
                    }, 700);
                    return;
                }

                var errorData = {};
                try { errorData = await response.json(); } catch (e) { /* 忽略非 JSON 响应 */ }
                if (response.status === 429 && errorData.retry_after) {
                    startLockCountdown(errorData.retry_after);
                } else {
                    showError(errorData.message || '登录失败，请重试');
                }
            } catch (err) {
                showError('登录请求失败，请检查网络连接');
            }

            loginBtn.disabled = false;
            loginBtn.innerHTML = '登录';
        });
    })();
    </script>
</body>
</html>
