<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>菜单管理</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    {% include '_styles.html' %}
    <style>
        /* 侧边栏分组管理页：与新版侧栏保持一致的轻量扁平风格 */
        .mm-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
        .mm-desc { margin: 0; font-size: .82rem; color: #64748b; }
        .mm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
        .mm-group { display: flex; flex-direction: column; background: #fff; border: 1px solid #e5e9f0;
            border-radius: 12px; box-shadow: 0 4px 14px rgba(15, 23, 42, .05); overflow: hidden; }
        .mm-group-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #eef2f7; }
        .mm-title-input { flex: 1 1 auto; min-width: 0; padding: 6px 10px; border: 1px solid transparent; border-radius: 8px;
            background: #f8fafc; font-size: .88rem; font-weight: 600; color: #1f2937; transition: background .2s, border-color .2s, box-shadow .2s; }
        .mm-title-input:focus { outline: none; background: #fff; border-color: rgba(13, 110, 253, .35); box-shadow: 0 0 0 3px rgba(13, 110, 253, .1); }
        .mm-count { flex: 0 0 auto; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #94a3b8; font-size: .72rem; }
        .mm-icon-btn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
            width: 28px; height: 28px; padding: 0; border: 1px solid #e5e9f0; border-radius: 7px; background: #fff;
            color: #64748b; font-size: .75rem; cursor: pointer; transition: color .2s, border-color .2s, background .2s, transform .2s; }
        .mm-icon-btn:hover { color: #0d6efd; border-color: rgba(13, 110, 253, .3); background: #f5f9ff; transform: translateY(-1px); }
        .mm-icon-btn.danger:hover { color: #b91c1c; border-color: rgba(239, 68, 68, .3); background: #fef2f2; }
        .mm-icon-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
        .mm-entries { display: flex; flex-direction: column; gap: 6px; padding: 8px; min-height: 52px; }
        .mm-entry { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid #eef2f7;
            border-radius: 9px; background: #fbfdff; transition: background .2s, border-color .2s, box-shadow .2s; }
        .mm-entry:hover { background: #fff; border-color: rgba(13, 110, 253, .25); box-shadow: 0 3px 10px rgba(15, 23, 42, .05); }
        .mm-entry > .fa { flex: 0 0 auto; width: 16px; text-align: center; color: #64748b; }
        .mm-entry-title { flex: 0 0 auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: .84rem; font-weight: 600; color: #1f2937; }
        .mm-entry-summary { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: .72rem; color: #94a3b8; }
        /* 拖拽相关：手柄、拖动中、放置位置提示 */
        .mm-grip { flex: 0 0 auto; width: 16px; text-align: center; color: #94a3b8; cursor: grab; }
        .mm-grip:active { cursor: grabbing; }
        .mm-entry { cursor: grab; }
        .mm-entry.dragging, .mm-group.dragging { opacity: .45; }
        .mm-entry.drop-before { box-shadow: inset 0 3px 0 #0d6efd; }
        .mm-entry.drop-after { box-shadow: inset 0 -3px 0 #0d6efd; }
        .mm-entries.drop-into { background: #f0f7ff; box-shadow: inset 0 0 0 1px rgba(13, 110, 253, .25); }
        .mm-group.drag-over { border-color: rgba(13, 110, 253, .5); box-shadow: 0 0 0 3px rgba(13, 110, 253, .12); }
        .mm-empty { padding: 12px; text-align: center; color: #94a3b8; font-size: .8rem; }
        .mm-status { min-height: 20px; margin-bottom: 8px; font-size: .8rem; }
        .mm-status.ok { color: #15803d; }
        .mm-status.err { color: #b91c1c; }
        @media (max-width: 575.98px) {
            .mm-grid { grid-template-columns: 1fr; }
            .mm-entry-summary { display: none; }
        }
    </style>
</head>
<body>
{% include '_navbar.html' %}
<div class="container-fluid mt-4">
    <div class="mm-head">
        <div>
            <h1 class="h3 mb-1" style="color:#1f2937;">菜单管理 · 侧边栏分组</h1>
            <p class="mm-desc">拖动分组左侧手柄调整顺序；拖动菜单可跨分组移动或组内排序；保存后全站生效，页面权限仍按原规则过滤。</p>
        </div>
        <div class="d-flex flex-wrap" style="gap:8px;">
            <button type="button" class="btn btn-outline-primary btn-sm" id="mmAddGroup"><i class="fa fa-plus"></i> 新增分组</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="mmReset"><i class="fa fa-undo"></i> 恢复默认</button>
            <button type="button" class="btn btn-primary btn-sm" id="mmSave"><i class="fa fa-save"></i> 保存配置</button>
        </div>
    </div>

    <div class="alert alert-info py-2 px-3" style="font-size:.82rem;">
        <i class="fa fa-info-circle"></i>
        分组只影响侧边栏的归类与排序，不会改变页面地址与权限：用户看不到自己无权限的菜单；分组内菜单全部无权限时，该分组自动隐藏。
    </div>

    <div class="mm-status" id="mmStatus"></div>
    <div class="mm-grid" id="mmGroups">
        <div class="mm-empty"><i class="fa fa-spinner fa-spin"></i> 加载中...</div>
    </div>
</div>

<script defer src="{{ url_for('static', filename='js/menu_management.js') }}?v=20261124"></script>
</body>
</html>
