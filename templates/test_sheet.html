<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试皮子换算 - 大焱资料管理系统</title>
    <!-- 引入Bootstrap CSS -->
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Font Awesome -->
    <link href="../static/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    {% include '_navbar.html' %}
    <div class="container-fluid mt-4">
        <!-- 页面标题 -->
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">测试皮子换算</h1>
        </div>
        
        <!-- 主要内容 -->
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">皮子换算计算器</h5>
                    </div>
                    <div class="card-body">
                        <form method="POST" enctype="multipart/form-data" id="uploadForm">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="form-group">
                                <label for="excelFile" class="form-label">上传Excel文件</label>
                                <input type="file" class="form-control" id="excelFile" name="excelFile" accept=".xls, .xlsx" required>
                                <div class="form-text">请上传包含车种、EO、品番、LOT、数量信息的Excel文件</div>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa fa-upload me-2"></i> 上传并计算
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入Bootstrap JS -->
    <script src="../static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
