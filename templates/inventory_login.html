<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <title>盘点数据登录 - 大焱资料管理系统</title>
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/font-awesome.min.css" rel="stylesheet">
    {% include '_styles.html' %}
    <style>
        .container-fluid { padding-left: 10px; padding-right: 10px; }
        .card { margin-bottom: 12px; }
        .card-header { font-weight: 700; font-size: 1rem; }
        .req::after { content: ' *'; color: #dc3545; }
        .team-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border: 1px solid #e9ecef; border-radius: 8px;
            margin-bottom: 8px; background: #fff;
        }
        .team-item.is-off { background: #f8f9fa; opacity: 0.75; }
        .team-name { font-weight: 600; font-size: 1rem; word-break: break-all; }
        .team-meta { font-size: 0.8rem; color: #868e96; margin-top: 2px; }
        .btn-main { min-height: 46px; }
        .btn-submit { min-height: 54px; font-size: 1.15rem; font-weight: 700; }
        @media (max-width: 767.98px) {
            .container-fluid.mt-4 { margin-top: 0.5rem !important; }
            .card-body { padding: 0.85rem; }
            .btn-sm { min-height: 38px; padding-left: 0.9rem; padding-right: 0.9rem; }
        }
    </style>
</head>
<body>
    {% include '_navbar.html' %}
    <div class="container-fluid mt-4">
        {% if can_edit %}
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fa fa-tasks me-1"></i>盘点作业</span>
                <button class="btn btn-sm btn-outline-primary" id="btnOpenTeamModal" title="盘点班组维护">
                    <i class="fa fa-users me-1"></i>盘点班组维护
                </button>
            </div>
            <div class="card-body">
                <div class="text-center text-muted py-4 small">点击右上角「盘点班组维护」管理班组</div>
            </div>
        </div>
        {% endif %}
    </div>

    <!-- 盘点班组维护弹窗 -->
    <div class="modal fade" id="teamModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <span class="modal-title fw-bold"><i class="fa fa-users me-1"></i>盘点班组维护</span>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    {% if can_edit %}
                    <div class="row g-2 mb-3">
                        <div class="col-5">
                            <input type="text" class="form-control" id="newTeamName" placeholder="班组名称*" maxlength="50">
                        </div>
                        <div class="col-3">
                            <input type="number" class="form-control" id="newTeamSort" placeholder="排序" min="0" inputmode="numeric">
                        </div>
                        <div class="col-4">
                            <button class="btn btn-primary w-100 btn-main" id="btnAddTeam">
                                <i class="fa fa-plus me-1"></i>新增班组
                            </button>
                        </div>
                    </div>
                    {% endif %}
                    <div id="teamList">
                        <div class="text-center text-muted py-4 small">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定义确认框（替代原生 confirm，兼容 WebView） -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body py-3">
                    <div id="confirmText" class="mb-0"></div>
                </div>
                <div class="modal-footer py-2">
                    <button class="btn btn-secondary btn-sm" id="btnConfirmNo">取消</button>
                    <button class="btn btn-danger btn-sm" id="btnConfirmYes">确定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        var CSRFEl = document.querySelector('meta[name="csrf-token"]');
        var CSRF = CSRFEl ? CSRFEl.getAttribute('content') : '';
        var CAN_EDIT = {{ 'true' if can_edit else 'false' }};
        var URLS = {
            teams: '{{ url_for("main.inventory_teams") }}',
            teamSave: '{{ url_for("main.inventory_team_save") }}',
            teamDelete: '{{ url_for("main.inventory_team_delete") }}'
        };

        function esc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function toast(msg, ok) {
            var div = document.createElement('div');
            div.className = 'alert alert-' + (ok ? 'success' : 'danger') + ' position-fixed top-0 start-50 translate-middle-x mt-3 shadow';
            div.style.zIndex = 3000;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(function () { div.remove(); }, 2200);
        }
        function postJSON(url, payload) {
            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                body: JSON.stringify(payload || {})
            }).then(function (r) { return r.json(); });
        }
        function getJSON(url) {
            return fetch(url, { headers: { 'X-CSRFToken': CSRF } }).then(function (r) { return r.json(); });
        }

        var confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
        var confirmHandler = null;
        function showConfirm(text, onYes) {
            document.getElementById('confirmText').textContent = text;
            confirmHandler = onYes;
            confirmModal.show();
        }
        document.getElementById('btnConfirmYes').addEventListener('click', function () {
            confirmModal.hide();
            var fn = confirmHandler; confirmHandler = null;
            if (fn) { fn(); }
        });
        document.getElementById('btnConfirmNo').addEventListener('click', function () {
            confirmHandler = null; confirmModal.hide();
        });

        // ---------- 班组列表 ----------
        function renderTeamList(items) {
            var box = document.getElementById('teamList');
            if (!items.length) {
                box.innerHTML = '<div class="text-center text-muted py-4 small">暂无班组，请在上方新增</div>';
                return;
            }
            box.innerHTML = items.map(function (t) {
                return '<div class="team-item' + (t.is_active ? '' : ' is-off') + '" data-id="' + t.id + '">' +
                    '<div class="flex-grow-1 me-2">' +
                        '<div class="team-name">' + esc(t.name) +
                            (t.is_active ? '' : ' <span class="badge bg-secondary">停用</span>') + '</div>' +
                        '<div class="team-meta">排序 ' + t.sort_no + (t.remark ? ' · ' + esc(t.remark) : '') + '</div>' +
                    '</div>' +
                    (CAN_EDIT ? '<div class="d-flex gap-1 flex-shrink-0">' +
                        '<button class="btn btn-sm btn-outline-primary btn-team-edit" data-id="' + t.id +
                            '" data-name="' + esc(t.name) + '" data-sort="' + t.sort_no +
                            '" data-remark="' + esc(t.remark || '') + '" data-active="' + (t.is_active ? '1' : '0') + '">编辑</button>' +
                        '<button class="btn btn-sm btn-outline-secondary btn-team-toggle" data-id="' + t.id +
                            '" data-active="' + (t.is_active ? '1' : '0') + '">' + (t.is_active ? '停用' : '启用') + '</button>' +
                        '<button class="btn btn-sm btn-outline-danger btn-team-del" data-id="' + t.id +
                            '" data-name="' + esc(t.name) + '">删除</button>' +
                    '</div>' : '') +
                '</div>';
            }).join('');
        }
        function loadTeams() {
            return getJSON(URLS.teams + '?all=1').then(function (res) {
                renderTeamList(res.success ? res.items : []);
                if (!res.success && res.error) { toast(res.error, false); }
            });
        }

        var teamModal = new bootstrap.Modal(document.getElementById('teamModal'));
        var btnOpenTeamModal = document.getElementById('btnOpenTeamModal');
        if (btnOpenTeamModal) {
            btnOpenTeamModal.addEventListener('click', function () {
                resetTeamForm(); // 每次打开都回到新增模式
                teamModal.show();
                loadTeams(); // 每次打开都拉取最新数据
            });
        }

        var btnAddTeam = document.getElementById('btnAddTeam');
        var editingId = null; // 非空表示当前处于编辑模式
        var nameInput = document.getElementById('newTeamName');
        var sortInput = document.getElementById('newTeamSort');

        function resetTeamForm() {
            editingId = null;
            if (!btnAddTeam) return; // 无编辑权限时表单不存在
            nameInput.value = '';
            sortInput.value = '';
            btnAddTeam.innerHTML = '<i class="fa fa-plus me-1"></i>新增班组';
            btnAddTeam.classList.remove('btn-success');
            btnAddTeam.classList.add('btn-primary');
            btnAddTeam.removeAttribute('data-active');
        }

        if (btnAddTeam) {
            btnAddTeam.addEventListener('click', function () {
                var name = nameInput.value.trim();
                var sort = sortInput.value.trim();
                if (!name) { toast('请输入班组名称', false); nameInput.focus(); return; }
                var payload = { name: name, sort_no: sort || 0 };
                if (editingId) {
                    payload.id = editingId;
                    payload.is_active = btnAddTeam.getAttribute('data-active') !== '0';
                }
                postJSON(URLS.teamSave, payload).then(function (res) {
                    if (res.success) {
                        toast(editingId ? '修改成功' : '新增成功', true);
                        // 编辑模式需保留 is_active，重置后再清空
                        resetTeamForm();
                        loadTeams();
                    } else { toast(res.error || '保存失败', false); }
                }).catch(function () { toast('网络异常，请重试', false); });
            });
            // 回车提交
            sortInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); btnAddTeam.click(); }
            });
            nameInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); sortInput.focus(); }
            });
        }

        document.getElementById('teamList').addEventListener('click', function (e) {
            var editBtn = e.target.closest('.btn-team-edit');
            if (editBtn) {
                // 回填表单进入编辑模式
                editingId = editBtn.getAttribute('data-id');
                nameInput.value = editBtn.getAttribute('data-name') || '';
                sortInput.value = editBtn.getAttribute('data-sort') || '';
                btnAddTeam.setAttribute('data-active', editBtn.getAttribute('data-active') || '1');
                btnAddTeam.innerHTML = '<i class="fa fa-check me-1"></i>保存修改';
                btnAddTeam.classList.remove('btn-primary');
                btnAddTeam.classList.add('btn-success');
                nameInput.focus();
                return;
            }
            var delBtn = e.target.closest('.btn-team-del');
            if (delBtn) {
                var id = delBtn.getAttribute('data-id');
                var nm = delBtn.getAttribute('data-name');
                showConfirm('确定删除班组「' + nm + '」？', function () {
                    postJSON(URLS.teamDelete, { id: id }).then(function (res) {
                        toast(res.success ? '删除成功' : (res.error || '删除失败'), res.success);
                        if (res.success) {
                            if (editingId === id) { resetTeamForm(); } // 删除的正是编辑中的班组
                            loadTeams();
                        }
                    }).catch(function () { toast('网络异常，请重试', false); });
                });
                return;
            }
            var tgBtn = e.target.closest('.btn-team-toggle');
            if (tgBtn) {
                var tid = tgBtn.getAttribute('data-id');
                var act = tgBtn.getAttribute('data-active') === '1';
                // 停用/启用：先读取班组当前信息再保存（接口要求全量字段）
                getJSON(URLS.teams + '?all=1').then(function (res) {
                    var t = (res.items || []).filter(function (x) { return String(x.id) === String(tid); })[0];
                    if (!t) { return; }
                    postJSON(URLS.teamSave, { id: t.id, name: t.name, sort_no: t.sort_no, remark: t.remark, is_active: !act })
                        .then(function (r2) {
                            toast(r2.success ? '操作成功' : (r2.error || '操作失败'), r2.success);
                            if (r2.success) { loadTeams(); }
                        }).catch(function () { toast('网络异常，请重试', false); });
                });
            }
        });
    })();
    </script>
</body>
</html>
