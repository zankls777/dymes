<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统维护中 - 大焱资料管理系统</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0d6efd 0%, #4da3ff 55%, #6ea8fe 100%);
            color: #1f2937;
        }
        .mt-wrapper { width: 100%; max-width: 620px; }
        .mt-card {
            background: #fff;
            border-radius: 14px;
            padding: 40px 32px 32px;
            box-shadow: 0 18px 48px rgba(13, 110, 253, 0.28);
            text-align: center;
            animation: rise 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mt-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
        }
        .mt-title { font-size: 1.35rem; font-weight: 700; margin: 6px 0 10px; }
        .mt-desc { font-size: 0.95rem; color: #6b7280; margin-bottom: 24px; line-height: 1.7; }
        .mt-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .mt-actions .btn { border-radius: 8px; font-weight: 600; padding: 8px 18px; }
        .mt-hint {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px dashed #e5e9f0;
            font-size: 0.8rem;
            color: #9ca3af;
        }
        @media (max-width: 575.98px) {
            .mt-card { padding: 30px 20px 24px; }
            .mt-title { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <div class="mt-wrapper">
        <div class="mt-card">
            <div class="mt-icon"><i class="fa fa-wrench"></i></div>
            <div class="mt-title">系统正在维护中</div>
            <div class="mt-desc">
                为提供更稳定的服务，系统当前正在进行维护升级，暂时无法访问。<br>
                请您稍后重试，给您带来的不便敬请谅解。
            </div>

            {% if is_admin %}
            <div class="mt-actions">
                <a href="{{ url_for('main.developer_settings') }}" class="btn btn-primary">
                    <i class="fa fa-cog me-1"></i>前往设置关闭维护
                </a>
            </div>
            {% else %}
            <div class="mt-actions">
                <button type="button" onclick="location.reload()" class="btn btn-primary">
                    <i class="fa fa-refresh me-1"></i>刷新重试
                </button>
            </div>
            {% endif %}

            <div class="mt-hint">
                {% if is_admin %}
                管理员账号仍可正常访问系统，请在所有维护操作完成后关闭维护开关。
                {% else %}
                如有紧急需求，请联系系统管理员。
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
