<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <title>不良品清单导出 - 大焱资料管理系统</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    {% include '_styles.html' %}
    <style>
        .container-fluid { padding-left: 12px; padding-right: 12px; }
        .filter-bar {
            background: #fff; border: 1px solid #e9ecef; border-radius: 10px;
            padding: 12px 14px; margin-bottom: 14px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
        }
        .filter-bar .form-label { font-size: .82rem; color: #6c757d; margin-bottom: 4px; font-weight: 600; }
        .stat-card {
            background: #fff; border: 1px solid #e9ecef; border-radius: 10px;
            padding: 12px 14px; height: 100%; box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
        }
        .stat-card .label { font-size: .8rem; color: #868e96; margin-bottom: 4px; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; line-height: 1.15; color: #1c7ed6; }
        .stat-card .unit { font-size: .78rem; color: #adb5bd; margin-left: 4px; font-weight: 400; }
        .btn-export { min-height: 46px; font-size: 1.02rem; font-weight: 700; }
        .quick-range .btn { font-size: .82rem; }
        @media (max-width: 767.98px) {
            .container-fluid { padding-left: 10px; padding-right: 10px; }
            .btn-export { width: 100%; }
        }
    </style>
</head>
<body>
    {% include '_navbar.html' %}

    <div class="container-fluid mt-3">
        <div class="page-head d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <h5 class="mb-0"><i class="fa fa-file-excel-o me-2"></i>不良品清单导出</h5>
        </div>

        <div class="filter-bar">
            <div class="row g-2 align-items-end">
                <div class="col-6 col-md-3">
                    <label class="form-label">开始日期</label>
                    <input type="date" class="form-control" id="startDate">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label">结束日期</label>
                    <input type="date" class="form-control" id="endDate">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label">班组</label>
                    <select class="form-select" id="teamSelect">
                        <option value="">全部班组</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label">关键字</label>
                    <input type="text" class="form-control" id="keyword" placeholder="品番/品名/登记人/备注" autocomplete="off">
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center mt-2">
                <div class="quick-range d-flex gap-1">
                    <button class="btn btn-outline-secondary btn-sm" data-range="today">今天</button>
                    <button class="btn btn-outline-secondary btn-sm" data-range="week">近7天</button>
                    <button class="btn btn-outline-secondary btn-sm" data-range="month">本月</button>
                    <button class="btn btn-outline-secondary btn-sm" data-range="all">全部</button>
                </div>
                <button class="btn btn-outline-primary btn-sm" id="btnPreview">
                    <i class="fa fa-search me-1"></i>预览
                </button>
            </div>
        </div>

        <!-- 预览统计 -->
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-3">
                <div class="stat-card"><div class="label">记录条数</div><div class="value" id="statCount">-</div></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card"><div class="label">废弃总数量</div><div class="value" id="statQty">-</div></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card"><div class="label">涉及班组</div><div class="value" id="statTeam">-</div></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card"><div class="label">涉及资材品番</div><div class="value" id="statPno">-</div></div>
            </div>
        </div>

        <div class="mb-4">
            {% if can_export %}
            <button class="btn btn-success btn-export" id="btnExport">
                <i class="fa fa-download me-1"></i>导出 Excel（明细 + 汇总）
            </button>
            {% else %}
            <div class="alert alert-warning mb-0 small">您没有导出不良品清单的权限，请联系管理员。</div>
            {% endif %}
        </div>

        <!-- 预览明细 -->
        <div class="card">
            <div class="card-header bg-light py-2"><span class="small fw-bold"><i class="fa fa-list-ul me-2"></i>数据预览</span></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="text-center">登记日期</th>
                                <th class="text-center">班组</th>
                                <th class="text-center">登记人</th>
                                <th class="text-center">资材品番</th>
                                <th class="text-center">品名</th>
                                <th class="text-center">废弃数量</th>
                                <th class="text-center">废弃原因</th>
                            </tr>
                        </thead>
                        <tbody id="previewBody">
                            <tr><td colspan="7" class="text-center text-muted py-3">点击「预览」查看数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
    (function () {
        var CSRFEl = document.querySelector('meta[name="csrf-token"]');
        var CSRF = CSRFEl ? CSRFEl.getAttribute('content') : '';
        var URLS = {
            teams: '{{ url_for("main.inventory_teams") }}',
            data: '{{ url_for("main.defective_login_data") }}',
            download: '{{ url_for("main.defective_export_download") }}'
        };

        function esc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function today() {
            var d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function fmt(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function toast(msg, ok) {
            var div = document.createElement('div');
            div.className = 'alert alert-' + (ok ? 'success' : 'danger') + ' position-fixed top-0 start-50 translate-middle-x mt-3 shadow';
            div.style.zIndex = 3000; div.style.minWidth = '260px'; div.style.pointerEvents = 'none';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(function () { if (div.parentNode) { div.parentNode.removeChild(div); } }, 2600);
        }
        function getJSON(url) {
            return fetch(url, { headers: { 'X-CSRFToken': CSRF } }).then(function (r) { return r.json(); });
        }

        // 班组下拉（复用盘点班组接口）
        getJSON(URLS.teams).then(function (res) {
            var sel = document.getElementById('teamSelect');
            if (res.success) {
                res.items.forEach(function (t) {
                    var opt = document.createElement('option');
                    opt.value = t.id; opt.textContent = t.name;
                    sel.appendChild(opt);
                });
            }
        });

        // 快捷日期范围
        function applyRange(type) {
            var s = document.getElementById('startDate');
            var e = document.getElementById('endDate');
            var now = new Date();
            if (type === 'today') { s.value = today(); e.value = today(); }
            else if (type === 'week') {
                var d = new Date(now.getTime() - 6 * 86400000);
                s.value = fmt(d); e.value = today();
            } else if (type === 'month') {
                s.value = fmt(new Date(now.getFullYear(), now.getMonth(), 1)); e.value = today();
            } else { s.value = ''; e.value = ''; }
        }
        document.querySelectorAll('.quick-range .btn').forEach(function (b) {
            b.addEventListener('click', function () { applyRange(b.getAttribute('data-range')); doPreview(); });
        });

        function buildQuery() {
            var params = [];
            var s = document.getElementById('startDate').value;
            var e = document.getElementById('endDate').value;
            var t = document.getElementById('teamSelect').value;
            var k = document.getElementById('keyword').value.trim();
            if (s) { params.push('start_date=' + encodeURIComponent(s)); }
            if (e) { params.push('end_date=' + encodeURIComponent(e)); }
            if (t) { params.push('team_id=' + encodeURIComponent(t)); }
            if (k) { params.push('keyword=' + encodeURIComponent(k)); }
            return params.length ? ('?' + params.join('&')) : '';
        }

        // 预览：按日期区间 + 班组 + 关键字查询
        function doPreview() {
            var body = document.getElementById('previewBody');
            body.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">加载中...</td></tr>';
            var q = buildQuery();
            getJSON(URLS.data + q).then(function (res) {
                if (!res.success) { body.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-3">' + esc(res.error || '查询失败') + '</td></tr>'; return; }
                var items = res.items || [];
                document.getElementById('statCount').textContent = items.length;
                document.getElementById('statQty').textContent = (res.summary && res.summary.scrap_qty) || 0;
                var teams = {}, pnos = {};
                items.forEach(function (it) { teams[it.team_name] = 1; pnos[it.ksc_pno] = 1; });
                document.getElementById('statTeam').textContent = Object.keys(teams).length;
                document.getElementById('statPno').textContent = Object.keys(pnos).length;
                if (!items.length) { body.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">该条件下无数据</td></tr>'; return; }
                body.innerHTML = items.map(function (it) {
                    return '<tr>' +
                        '<td class="text-center">' + esc(it.login_date) + '</td>' +
                        '<td class="text-center">' + esc(it.team_name) + '</td>' +
                        '<td class="text-center">' + esc(it.reporter_name) + '</td>' +
                        '<td class="text-center">' + esc(it.ksc_pno) + '</td>' +
                        '<td>' + esc(it.part_name || '') + '</td>' +
                        '<td class="text-center">' + it.scrap_qty + '</td>' +
                        '<td class="text-center">' + esc(it.reason || '') + '</td></tr>';
                }).join('');
            }).catch(function () {
                body.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-3">网络异常</td></tr>';
            });
        }
        document.getElementById('btnPreview').addEventListener('click', doPreview);

        // 导出
        var btnExport = document.getElementById('btnExport');
        if (btnExport) {
            btnExport.addEventListener('click', function () {
                var url = URLS.download + buildQuery();
                btnExport.disabled = true;
                window.location.href = url;
                toast('正在生成 Excel，请稍候...', true);
                setTimeout(function () { btnExport.disabled = false; }, 3000);
            });
        }

        // 默认近7天并预览
        applyRange('week');
        doPreview();
    })();
    </script>
</body>
</html>
