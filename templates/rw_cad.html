<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <title>RW图纸产出</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/font-awesome.min.css" rel="stylesheet">
    {% include '_styles.html' %}
    <style>
        .rc-step { border: 1px solid #dee2e6; border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; background: #fff; }
        .rc-step .rc-step-title { font-weight: 600; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; }
        .rc-step .rc-badge { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: #0d6efd; color: #fff;
            align-items: center; justify-content: center; font-size: 12px; margin-right: 8px; }
        .rc-file-item { display: flex; align-items: center; padding: 8px 12px; border: 1px solid #e9ecef;
            border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
        .rc-file-item.active { border-color: #0d6efd; background: #eef5ff; }
        .rc-file-item .rc-fname { flex: 1; word-break: break-all; margin-left: 8px; }
        .rc-legend span { display: inline-flex; align-items: center; margin-right: 18px; font-size: 13px; }
        .rc-legend .box { display: inline-block; width: 16px; height: 12px; border: 2px solid #d00; margin-right: 5px; }
        .rc-legend .circle { display: inline-block; width: 14px; height: 14px; border: 2px solid #d00; border-radius: 50%; margin-right: 5px; }
        .rc-summary { font-size: 12px; color: #555; }
        .rc-result-row { font-size: 13px; }
    </style>
</head>
<body>
    {% include '_navbar.html' %}

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-12">
                <h2 class="mt-4 mb-2">RW图纸产出</h2>
                <p class="text-muted mb-4" style="font-size:13px;">
                    上传 RW 差异文件与 DXF 图纸（均可多份），系统按图纸文件名自动识别品番并标记回路：
                    <span class="rc-legend">
                        <span><i class="box"></i>增加回路</span>
                        <span><i class="circle"></i>删除回路</span>
                    </span>
                </p>

                <!-- 步骤1：上传 RW 差异文件 -->
                <div class="rc-step">
                    <div class="rc-step-title"><span class="rc-badge">1</span>上传 RW 差异文件（Excel，含「SubList差异」表，可多选）</div>
                    <div class="d-flex gap-2 mb-3">
                        <input type="file" class="form-control form-control-sm" id="diffFile" accept=".xlsx,.xls" multiple style="max-width:420px;">
                        <button type="button" class="btn btn-sm btn-outline-primary" id="uploadDiffBtn">
                            <i class="fa fa-upload me-1"></i>上传
                        </button>
                    </div>
                    <div id="diffList"></div>
                </div>

                <!-- 步骤2：上传 DXF 图纸 -->
                <div class="rc-step">
                    <div class="rc-step-title"><span class="rc-badge">2</span>上传 DXF 图纸（文件名需含品番，可多选）</div>
                    <div class="d-flex gap-2 mb-3">
                        <input type="file" class="form-control form-control-sm" id="dxfFile" accept=".dxf" multiple style="max-width:420px;">
                        <button type="button" class="btn btn-sm btn-outline-primary" id="uploadBtn">
                            <i class="fa fa-upload me-1"></i>上传
                        </button>
                    </div>
                    <div id="fileList"></div>
                </div>

                <!-- 步骤3：生成 -->
                <div class="rc-step">
                    <div class="rc-step-title"><span class="rc-badge">3</span>生成标记图纸</div>
                    <p class="rc-summary mb-2">已选差异文件：<code id="selDiff">0 份</code>　已选图纸：<code id="selDxf">0 份</code></p>
                    <button type="button" class="btn btn-sm btn-success" id="genBtn">
                        <i class="fa fa-magic me-1"></i>批量生成标记图纸
                    </button>
                    <div id="genResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    {% include '_scripts.html' %}
    <script>
        function getCsrfToken() {
            const m = document.querySelector('meta[name="csrf-token"]');
            return m ? m.content : '';
        }

        // 安全解析响应：后端出错时可能返回 HTML 错误页，避免直接 json() 抛
        // "Unexpected token '<'"。此处统一转为带 error 的 JSON 结构。
        async function parseResp(resp) {
            const ct = resp.headers.get('content-type') || '';
            if (ct.includes('application/json')) {
                try { return await resp.json(); }
                catch (e) { return { success: false, error: '响应解析失败: ' + e.message }; }
            }
            // 非 JSON：多为登录失效或 CSRF 校验失败
            if (resp.status === 401 || resp.status === 403) {
                return { success: false, error: '登录状态已失效或权限不足，请刷新页面重新登录', need_login: true };
            }
            if (resp.status === 400) {
                return { success: false, error: '请求被拒绝（可能页面已过期），请刷新页面后重试' };
            }
            return { success: false, error: '服务器返回异常（HTTP ' + resp.status + '），请稍后重试' };
        }

        const selDiffs = new Set();   // 选中的差异文件 id
        const selDxfs = new Set();    // 选中的图纸 id
        // 记录已被自动选中过的文件 id，避免用户手动取消后又被重新勾选
        const seenDiffs = new Set();
        const seenDxfs = new Set();

        // ---- 通用上传 ----
        async function uploadFiles(endpoint, inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input.files.length) { alert('请先选择文件'); return null; }
            const fd = new FormData();
            for (const f of input.files) fd.append('files', f);
            const old = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>上传中';
            try {
                const resp = await fetch(endpoint, {
                    method: 'POST', headers: { 'X-CSRFToken': getCsrfToken() }, body: fd
                });
                const data = await parseResp(resp);
                if (!data.success) { alert(data.error || '上传失败'); return null; }
                input.value = '';
                return data;
            } catch (e) {
                alert('上传失败: ' + e.message);
                return null;
            } finally {
                btn.disabled = false;
                btn.innerHTML = old;
            }
        }

        function reportErrors(data) {
            if (data && data.errors && data.errors.length) {
                alert('部分文件未上传：\n' + data.errors.map(e => e.filename + '：' + e.error).join('\n'));
            }
        }

        // ---- 上传差异文件 ----
        document.getElementById('uploadDiffBtn').addEventListener('click', async function () {
            const data = await uploadFiles('/api/rw_cad/upload_diff', 'diffFile', this);
            if (!data) return;
            reportErrors(data);
            const tip = (data.results || []).map(r =>
                r.filename + ' → ' + r.summary.map(s => `${s.pno}(增${s.add}/删${s.del})`).join('、')
            ).join('\n');
            if (tip) alert('差异文件解析成功：\n' + tip);
            await loadFiles();
        });

        // ---- 上传图纸 ----
        document.getElementById('uploadBtn').addEventListener('click', async function () {
            const data = await uploadFiles('/api/rw_cad/upload', 'dxfFile', this);
            if (!data) return;
            reportErrors(data);
            await loadFiles();
        });

        // ---- 列表 ----
        function renderList(boxId, items, selSet, kind) {
            const box = document.getElementById(boxId);
            if (!items.length) { box.innerHTML = '<div class="text-muted" style="font-size:13px;">暂无文件</div>'; return; }
            const allChecked = items.length && items.every(f => selSet.has(f.file_id));
            box.innerHTML = `
                <div class="mb-1" style="font-size:12px;">
                    <label class="me-2"><input type="checkbox" ${allChecked ? 'checked' : ''}
                        onclick="toggleAll('${kind}', this.checked)"> 全选</label>
                </div>` +
                items.map(f => `
                <div class="rc-file-item ${selSet.has(f.file_id) ? 'active' : ''}">
                    <input type="checkbox" ${selSet.has(f.file_id) ? 'checked' : ''}
                        onclick="toggleSel('${kind}','${f.file_id}',this.checked)">
                    <span class="rc-fname">
                        <i class="fa fa-file-o me-1"></i>${f.filename}
                        <span class="text-muted ms-2" style="font-size:12px;">${f.mtime}</span>
                    </span>
                    <button class="btn btn-sm btn-link text-danger" onclick="delFile('${f.file_id}','${kind}')">
                        <i class="fa fa-trash"></i>
                    </button>
                </div>`).join('');
        }

        function toggleSel(kind, id, checked) {
            const set = kind === 'diffs' ? selDiffs : selDxfs;
            if (checked) set.add(id); else set.delete(id);
            loadFiles();
        }
        function toggleAll(kind, checked) {
            const set = kind === 'diffs' ? selDiffs : selDxfs;
            const items = kind === 'diffs' ? curDiffs : curFiles;
            set.clear();
            if (checked) items.forEach(f => set.add(f.file_id));
            loadFiles();
        }

        let curDiffs = [], curFiles = [];

        async function loadFiles() {
            try {
                // 携带时间戳并禁用缓存，确保每次访问都取到最新记录
                const resp = await fetch('/api/rw_cad/list?_t=' + Date.now(), { cache: 'no-store' });
                const data = await parseResp(resp);
                if (!data.success) {
                    document.getElementById('fileList').innerHTML = '<div class="text-muted" style="font-size:13px;">' + (data.error || '') + '</div>';
                    return;
                }
                curDiffs = data.diffs || [];
                curFiles = data.files || [];
                autoSelect(curDiffs, selDiffs, seenDiffs);
                autoSelect(curFiles, selDxfs, seenDxfs);
                renderList('diffList', curDiffs, selDiffs, 'diffs');
                renderList('fileList', curFiles, selDxfs, 'uploads');
                updateSel();
            } catch (e) {
                document.getElementById('fileList').innerHTML = '<div class="text-danger" style="font-size:13px;">加载失败</div>';
            }
        }

        function updateSel() {
            document.getElementById('selDiff').textContent = selDiffs.size + ' 份';
            document.getElementById('selDxf').textContent = selDxfs.size + ' 份';
        }

        // 新出现的文件默认全选；已见过的文件保持用户当前选择
        function autoSelect(items, selSet, seenSet) {
            items.forEach(f => {
                if (!seenSet.has(f.file_id)) {
                    seenSet.add(f.file_id);
                    selSet.add(f.file_id);
                }
            });
        }

        async function delFile(id, kind) {
            if (!confirm('确定删除该文件？')) return;
            const resp = await fetch('/api/rw_cad/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                body: JSON.stringify({ file_id: id, kind: kind })
            });
            const data = await parseResp(resp);
            if (data.success) {
                (kind === 'diffs' ? selDiffs : selDxfs).delete(id);
                (kind === 'diffs' ? seenDiffs : seenDxfs).delete(id);
                loadFiles();
            } else alert(data.error || '删除失败');
        }

        // ---- 批量生成 ----
        document.getElementById('genBtn').addEventListener('click', async function () {
            if (!selDiffs.size) { alert('请先上传并勾选 RW 差异文件'); return; }
            if (!selDxfs.size) { alert('请先上传并勾选 DXF 图纸'); return; }

            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>生成中';
            const resBox = document.getElementById('genResult');
            resBox.innerHTML = '';
            try {
                const resp = await fetch('/api/rw_cad/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                    body: JSON.stringify({ diff_ids: [...selDiffs], file_ids: [...selDxfs] })
                });
                const data = await parseResp(resp);
                if (!data.success) {
                    resBox.innerHTML = '<div class="alert alert-danger mb-0">生成失败：' + (data.error || '请稍后重试') + '</div>';
                    return;
                }
                const rows = (data.results || []).map(r => {
                    const miss = r.add_missing.length + r.del_missing.length;
                    const extra = miss ? `<span class="text-muted ms-2" style="font-size:12px;">（未找到回路 ${miss} 个）</span>` : '';
                    return `
                    <tr>
                        <td>${r.pno}</td>
                        <td>增加 ${r.add_circuits} 个 / 标记 ${r.add_marks} 处</td>
                        <td>删除 ${r.del_circuits} 个 / 标记 ${r.del_marks} 处</td>
                        <td>
                            <a class="btn btn-sm btn-primary" href="/api/rw_cad/download/${encodeURIComponent(r.file_id)}">
                                <i class="fa fa-download me-1"></i>下载
                            </a>${extra}
                        </td>
                    </tr>`;
                }).join('');
                const failHtml = (data.failed && data.failed.length)
                    ? `<div class="alert alert-warning mt-2 mb-0" style="font-size:12px;">未生成：` +
                      data.failed.map(f => f.file_id + '：' + f.error).join('<br>') + '</div>' : '';
                resBox.innerHTML = `
                    <div class="alert alert-success mb-0">
                        <div class="mb-2"><i class="fa fa-check-circle me-1"></i>生成成功 ${data.results.length} 份</div>
                        <table class="table table-sm mb-0">
                            <thead><tr><th>品番</th><th>增加（红框）</th><th>删除（红圈）</th><th>下载</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>${failHtml}`;
            } catch (e) {
                resBox.innerHTML = '<div class="alert alert-danger mb-0">生成失败: ' + e.message + '</div>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-magic me-1"></i>批量生成标记图纸';
            }
        });

        loadFiles();

        // 页面重新获得焦点/可见时实时刷新记录，无需手动刷新
        window.addEventListener('focus', loadFiles);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) loadFiles();
        });
    </script>
</body>
</html>
